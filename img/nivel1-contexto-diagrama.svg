<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1630" viewBox="0 0 1800 1630"><title>C1 · Contexto de App Barbería</title><desc>El sistema completo se relaciona con clientes, barberos y administradores de barbería, y utiliza Google, Resend, correo de acceso y mapas. Mapas, reseñas e imágenes están incluidos en el alcance.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#505050"/></marker></defs><rect width="1800" height="1630" fill="white"/>
<text x="900" y="66" font-family="Arial,sans-serif" font-size="43" font-weight="700" text-anchor="middle" fill="#202124">C1 · Contexto de App Barbería</text>
<text x="900" y="115" font-family="Arial,sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#202124">Alcance: el sistema completo, sus usuarios y los sistemas externos.</text>
<rect x="80" y="190" width="440" height="220" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="300" y="238" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#202124">Cliente</text>
<text x="300" y="279" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Persona</text>
<text x="300" y="323" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Explora, reserva y consulta pagos.</text>
<text x="300" y="358" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Busca en mapas y publica reseñas</text>
<text x="300" y="393" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">de sus atenciones completadas.</text>
<rect x="680" y="190" width="440" height="220" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="900" y="238" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#202124">Barbero</text>
<text x="900" y="279" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Persona</text>
<text x="900" y="323" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Gestiona su agenda y atenciones.</text>
<text x="900" y="358" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Verifica y confirma pagos</text>
<text x="900" y="393" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">de las citas que tiene asignadas.</text>
<rect x="1280" y="190" width="440" height="220" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1500" y="238" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#202124">Administrador de barbería</text>
<text x="1500" y="279" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Persona de un establecimiento</text>
<text x="1500" y="323" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#202124">Gestiona oferta, imágenes y personal.</text>
<text x="1500" y="358" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#202124">Confirma pagos y registra</text>
<text x="1500" y="393" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#202124">reembolsos de su barbería.</text>
<rect x="300" y="550" width="1200" height="390" fill="#ffffe6" stroke="#9d8af4" stroke-width="1.8"/>
<text x="326" y="593" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#202124">SISTEMA EN ESTUDIO</text>
<rect x="360" y="635" width="1080" height="240" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="900" y="687" font-family="Arial,sans-serif" font-size="35" font-weight="700" text-anchor="middle" fill="#202124">App Barbería</text>
<text x="900" y="732" font-family="Arial,sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#202124">Sistema de software · plataforma multitenant</text>
<text x="900" y="779" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Gestiona oferta, disponibilidad, reservas, atención y pagos manuales.</text>
<text x="900" y="814" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Incluye reseñas, mapas, imágenes y notificaciones.</text>
<text x="900" y="849" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Varias barberías comparten el sistema con permisos por establecimiento.</text>
<path d="M300 410V500H600V635" fill="none" stroke="#505050" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="315" y="430" width="358" height="38" fill="#f8f8f5"/>
<text x="323" y="455" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">consulta, reserva y valora</text>
<path d="M900 410V635" fill="none" stroke="#505050" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="920" y="430" width="358" height="71" fill="#f8f8f5"/>
<text x="928" y="455" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">gestiona agenda y atención</text>
<text x="928" y="488" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">confirma pagos asignados</text>
<path d="M1500 410V500H1200V635" fill="none" stroke="#505050" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="1310" y="430" width="306" height="38" fill="#f8f8f5"/>
<text x="1318" y="455" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">administra su barbería</text>
<path d="M500 875V1035H235V1200" fill="none" stroke="#505050" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="60" y="1075" width="241" height="71" fill="#f8f8f5"/>
<text x="68" y="1100" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">delega el acceso</text>
<text x="68" y="1133" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">con cuenta Google</text>
<path d="M760 875V1035H675V1200" fill="none" stroke="#505050" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="500" y="1075" width="241" height="71" fill="#f8f8f5"/>
<text x="508" y="1100" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">solicita el envío</text>
<text x="508" y="1133" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">de invitaciones</text>
<path d="M1040 875V1035H1115V1200" fill="none" stroke="#505050" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="900" y="1075" width="462" height="71" fill="#f8f8f5"/>
<text x="908" y="1100" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">solicita mensajes de confirmación</text>
<text x="908" y="1133" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">de correo y recuperación de acceso</text>
<path d="M1300 875V1035H1555V1200" fill="none" stroke="#505050" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="1390" y="1075" width="228" height="71" fill="#f8f8f5"/>
<text x="1398" y="1100" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">consulta mapas y</text>
<text x="1398" y="1133" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">geocodificación</text>
<rect x="40" y="1200" width="390" height="230" fill="#f1f2f5" stroke="#9d8af4" stroke-width="1.8"/>
<text x="235" y="1249" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#202124">Google</text>
<text x="235" y="1293" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Sistema externo</text>
<text x="235" y="1340" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Permite el inicio de sesión</text>
<text x="235" y="1375" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">con una cuenta Google.</text>
<rect x="480" y="1200" width="390" height="230" fill="#f1f2f5" stroke="#9d8af4" stroke-width="1.8"/>
<text x="675" y="1249" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#202124">Resend</text>
<text x="675" y="1293" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Sistema externo</text>
<text x="675" y="1340" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Entrega correos</text>
<text x="675" y="1375" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">de invitación al personal.</text>
<rect x="920" y="1200" width="390" height="230" fill="#f1f2f5" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1115" y="1249" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#202124">Servicio de correo de acceso</text>
<text x="1115" y="1293" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Sistema externo</text>
<text x="1115" y="1340" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#202124">Entrega mensajes de cuenta.</text>
<text x="1115" y="1375" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#202124">Proveedor configurado en Auth.</text>
<rect x="1360" y="1200" width="390" height="230" fill="#f1f2f5" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1555" y="1249" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202124">Mapas y geocodificación</text>
<text x="1555" y="1293" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Sistema externo</text>
<text x="1555" y="1340" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#202124">Mapas y búsqueda por proximidad.</text>
<text x="1555" y="1375" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#202124">Proveedor por seleccionar.</text>
<text x="55" y="1505" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">Flecha continua: uso o solicitud a otro elemento; las respuestas regresan por la misma relación.</text>
<text x="55" y="1546" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">Lavanda: personas y sistema en estudio. Amarillo: límite del sistema. Gris: sistemas externos.</text>
<text x="55" y="1587" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">Los roles se autorizan por barbería. El detalle de aplicaciones, servicios y almacenamiento se desarrolla en C2.</text>
</svg>