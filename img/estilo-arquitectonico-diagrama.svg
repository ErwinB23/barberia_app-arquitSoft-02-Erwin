<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1990" viewBox="0 0 2200 1990"><title>Estilo arquitectónico de App Barbería: cliente-servidor modular y tres capas lógicas</title><desc>El cliente ejecuta interfaz y casos de uso. Edge Functions aloja casos de uso críticos de servidor con contratos internos. PostgreSQL conserva datos y garantías transaccionales; Storage guarda imágenes.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#505050"/></marker></defs><rect width="2200" height="1990" fill="white"/>
<text x="1100" y="58" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle" fill="#202124">Estilo arquitectónico · Cliente-servidor modular</text>
<text x="1100" y="105" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Tres capas lógicas: presentación, aplicación/negocio y datos y archivos.</text>
<rect x="55" y="175" width="710" height="1175" fill="#fffef3" stroke="#9d8af4" stroke-width="1.8"/>
<text x="80" y="219" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#202124">CLIENTE · dispositivo o navegador</text>
<rect x="1150" y="175" width="990" height="1635" fill="#fffef3" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1175" y="219" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#202124">SERVIDOR · Supabase administrado (BaaS)</text>
<rect x="85" y="270" width="650" height="235" fill="#ffffe6" stroke="#9d8af4" stroke-width="1.8"/>
<text x="105" y="310" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#202124">1. PRESENTACIÓN</text>
<rect x="115" y="345" width="590" height="130" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="410" y="382" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202124">Interfaz de usuario</text>
<text x="410" y="421" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Expo · React Native · Expo Router</text>
<text x="410" y="454" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Pantallas, entradas y resultados</text>
<rect x="1200" y="320" width="890" height="140" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1645" y="357" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202124">Supabase Auth</text>
<text x="1645" y="396" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Identidad y sesiones · correo / Google</text>
<text x="1645" y="429" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Entrega el contexto de autenticación</text>
<rect x="85" y="615" width="650" height="690" fill="#ffffe6" stroke="#9d8af4" stroke-width="1.8"/>
<text x="105" y="655" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#202124">2. APLICACIÓN / NEGOCIO</text>
<rect x="115" y="720" width="590" height="170" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="410" y="757" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202124">Casos de uso y dominio del cliente</text>
<text x="410" y="796" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Reservas · horarios · catálogo · demás módulos</text>
<text x="410" y="829" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Validan la entrada y coordinan solicitudes</text>
<text x="410" y="862" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Usan contratos propios</text>
<rect x="115" y="1035" width="590" height="160" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="410" y="1072" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202124">Adaptadores del cliente</text>
<text x="410" y="1111" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Auth · consultas · servidor · imágenes</text>
<text x="410" y="1144" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Encapsulan el SDK y convierten resultados</text>
<path d="M410 475V720" fill="none" stroke="#505050" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="425" y="541" width="276.08" height="34" fill="#fff" stroke="#fff" stroke-width="1.8"/>
<text x="430" y="565" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202124">invoca el caso de uso</text>
<path d="M410 890V1035" fill="none" stroke="#505050" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="425" y="946" width="288.56" height="34" fill="#fff" stroke="#fff" stroke-width="1.8"/>
<text x="430" y="970" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202124">usa un contrato propio</text>
<rect x="1180" y="615" width="930" height="775" fill="#ffffe6" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1200" y="655" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#202124">2. APLICACIÓN / NEGOCIO</text>
<rect x="1200" y="720" width="890" height="170" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1645" y="757" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202124">Casos de uso de servidor · Edge Functions</text>
<text x="1645" y="796" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Reservas · pagos · reseñas · invitaciones · autorización</text>
<text x="1645" y="829" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Sesión verificada, reglas de dominio y contratos propios</text>
<text x="1645" y="862" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Dominio y aplicación independientes de Supabase</text>
<rect x="1200" y="1000" width="890" height="130" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1645" y="1037" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202124">Adaptadores del servidor</text>
<text x="1645" y="1076" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Implementan los contratos de persistencia e integración</text>
<text x="1645" y="1109" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Traducen solicitudes, datos y errores</text>
<rect x="1200" y="1240" width="890" height="115" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1645" y="1277" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202124">API de datos de Supabase · PostgREST</text>
<text x="1645" y="1316" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">REST: consultas autorizadas · RPC: funciones PostgreSQL</text>
<path d="M1645 890V1000" fill="none" stroke="#505050" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="1660" y="933" width="276.08" height="34" fill="#fff" stroke="#fff" stroke-width="1.8"/>
<text x="1665" y="957" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202124">usa contratos propios</text>
<path d="M1645 1130V1240" fill="none" stroke="#505050" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="1660" y="1166" width="338.48" height="34" fill="#fff" stroke="#fff" stroke-width="1.8"/>
<text x="1665" y="1190" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202124">accede mediante REST / RPC</text>
<path d="M705 1065H835V390H1200" fill="none" stroke="#505050" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="845" y="301" width="176.24" height="64" fill="#fff" stroke="#fff" stroke-width="1.8"/>
<text x="850" y="325" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202124">autenticación</text>
<text x="850" y="355" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202124">HTTPS</text>
<path d="M705 1100H935V805H1200" fill="none" stroke="#505050" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="945" y="726" width="226.16" height="64" fill="#fff" stroke="#fff" stroke-width="1.8"/>
<text x="950" y="750" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202124">operación crítica</text>
<text x="950" y="780" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202124">HTTPS + sesión</text>
<path d="M705 1150H1040V1297H1200" fill="none" stroke="#505050" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="780" y="1206" width="251.12" height="64" fill="#fff" stroke="#fff" stroke-width="1.8"/>
<text x="785" y="1230" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202124">consulta autorizada</text>
<text x="785" y="1260" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202124">HTTPS / REST</text>
<rect x="1180" y="1470" width="930" height="300" fill="#ffffe6" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1200" y="1515" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#202124">3. DATOS Y ARCHIVOS</text>
<rect x="1200" y="1570" width="400" height="165" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1400" y="1607" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#202124">Supabase Storage</text>
<text x="1400" y="1646" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Archivos de imagen</text>
<text x="1400" y="1679" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Buckets y políticas de acceso</text>
<text x="1400" y="1712" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Carga y cambios autorizados</text>
<path d="M1650 1590C1650 1560 2090 1560 2090 1590V1710C2090 1745 1650 1745 1650 1710Z" fill="#eefff6" stroke="#008b69" stroke-width="2"/><ellipse cx="1870" cy="1590" rx="220" ry="22" fill="#eefff6" stroke="#008b69" stroke-width="2"/>
<text x="1870" y="1641" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#202124">PostgreSQL compartido</text>
<text x="1870" y="1678" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#202124">Datos, rutas y metadatos de imágenes</text>
<text x="1870" y="1712" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#202124">RLS · integridad · transacciones</text>
<path d="M1870 1355V1568" fill="none" stroke="#505050" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="1885" y="1416" width="201.20000000000002" height="34" fill="#fff" stroke="#fff" stroke-width="1.8"/>
<text x="1890" y="1440" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202124">SQL / funciones</text>
<path d="M410 1195V1540H1400V1570" fill="none" stroke="#505050" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="425" y="1436" width="238.64000000000001" height="64" fill="#fff" stroke="#fff" stroke-width="1.8"/>
<text x="430" y="1460" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202124">imágenes por HTTPS</text>
<text x="430" y="1490" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202124">acceso autorizado</text>
<rect x="55" y="1640" width="1010" height="170" fill="#fff" stroke="#d7d7d7" stroke-width="1.8"/>
<text x="85" y="1680" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#202124">DISTRIBUCIÓN DE RESPONSABILIDADES</text>
<text x="85" y="1722" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">Núcleo: reglas puras y coordinación mediante contratos propios.</text>
<text x="85" y="1760" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">PostgreSQL: comprobaciones definitivas y escrituras atómicas.</text>
<text x="65" y="1870" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">Clean Architecture desde el inicio: presentación e infraestructura dependen del núcleo; la composición conecta implementaciones.</text>
<text x="65" y="1910" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202124">Las flechas representan llamadas en ejecución; la respuesta regresa por la misma relación. No representan dependencias del código.</text>
<text x="65" y="1950" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202124">Las capas son responsabilidades lógicas; el cliente y Supabase son entornos de ejecución. Los módulos no son microservicios.</text>
</svg>