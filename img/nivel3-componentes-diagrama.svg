<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="2320" viewBox="0 0 1900 2320"><title>C3 · Componentes de la Aplicación móvil</title><desc>Vista parcial de reservas dentro del cliente móvil: presentación, coordinación con contrato propio, modelo de reserva, adaptador HTTPS y composición. Operaciones de negocio es un contenedor externo al móvil, ejecutado en una Edge Function.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#505050"/></marker></defs><rect width="1900" height="2320" fill="white"/>
<text x="950" y="65" font-family="Arial,sans-serif" font-size="45" font-weight="700" text-anchor="middle" fill="#202124">C3 · Componentes de la Aplicación móvil</text>
<text x="950" y="118" font-family="Arial,sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#202124">Abre el contenedor móvil de C2. Vista parcial: solicitar una reserva con sesión disponible.</text>
<rect x="50" y="190" width="1800" height="1570" fill="#ffffe6" stroke="#9d8af4" stroke-width="1.8"/>
<text x="77" y="238" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#202124">APLICACIÓN MÓVIL · límite del contenedor</text>
<rect x="700" y="300" width="600" height="210" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1000" y="346" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#202124">Presentación de reservas</text>
<text x="1000" y="393" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Componente · Expo / React Native</text>
<text x="1000" y="430" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Recoge servicios, barbero, horario y medio.</text>
<text x="1000" y="467" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Muestra confirmación, conflicto o error.</text>
<rect x="1440" y="300" width="350" height="210" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1615" y="346" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#202124">Composición</text>
<text x="1615" y="393" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Componente · TypeScript</text>
<text x="1615" y="430" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Construye y conecta</text>
<text x="1615" y="467" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">caso de uso y adaptador.</text>
<rect x="700" y="810" width="600" height="260" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1000" y="856" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#202124">Coordinación de reservas</text>
<text x="1000" y="903" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Componente · TypeScript / Aplicación</text>
<text x="1000" y="940" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">SolicitarReserva valida la forma de entrada.</text>
<text x="1000" y="977" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Solicita confirmar mediante el contrato</text>
<text x="1000" y="1014" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">ReservaRemotaGateway.</text>
<rect x="100" y="810" width="450" height="280" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="325" y="856" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#202124">Modelo de reserva</text>
<text x="325" y="903" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Componente · TypeScript / Dominio</text>
<text x="325" y="940" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">SolicitudReserva</text>
<text x="325" y="977" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">ResultadoReserva</text>
<text x="325" y="1014" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Tipos y validaciones puras.</text>
<text x="325" y="1051" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Independientes del proveedor.</text>
<rect x="700" y="1330" width="600" height="220" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1000" y="1376" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#202124">Adaptador HTTP de reservas</text>
<text x="1000" y="1423" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Componente · TypeScript / Infraestructura</text>
<text x="1000" y="1460" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">ReservaHttpAdapter implementa el contrato.</text>
<text x="1000" y="1497" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Traduce solicitudes, respuestas y errores.</text>
<path d="M1000 510V810" fill="none" stroke="#505050" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="1025" y="630" width="358.5" height="73" fill="#fffffa" stroke="#fffffa" stroke-width="1.8"/>
<text x="1030" y="656" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">entrega la selección</text>
<text x="1030" y="690" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">e invoca SolicitarReserva</text>
<path d="M700 950H550" fill="none" stroke="#505050" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="563" y="841" width="128.48000000000002" height="73" fill="#fffffa" stroke="#fffffa" stroke-width="1.8"/>
<text x="568" y="865" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202124">usa tipos</text>
<text x="568" y="899" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202124">y valida</text>
<path d="M1000 1070V1330" fill="none" stroke="#505050" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="1025" y="1136" width="386.06" height="107" fill="#fffffa" stroke="#fffffa" stroke-width="1.8"/>
<text x="1030" y="1162" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">solicita confirmar mediante</text>
<text x="1030" y="1196" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">el contrato propio</text>
<text x="1030" y="1230" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">ReservaRemotaGateway</text>
<path d="M700 1440H325V1090" fill="none" stroke="#505050" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="350" y="1209" width="344.72" height="73" fill="#fffffa" stroke="#fffffa" stroke-width="1.8"/>
<text x="355" y="1235" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">usa tipos propios</text>
<text x="355" y="1269" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">para convertir los datos</text>
<path d="M1500 510V950H1300" fill="none" stroke="#505050" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
<rect x="1515" y="694" width="179.36" height="73" fill="#fffffa" stroke="#fffffa" stroke-width="1.8"/>
<text x="1520" y="720" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">crea el caso</text>
<text x="1520" y="754" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">de uso</text>
<path d="M1720 510V1440H1300" fill="none" stroke="#505050" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
<rect x="1415" y="1194" width="206.92000000000002" height="73" fill="#fffffa" stroke="#fffffa" stroke-width="1.8"/>
<text x="1420" y="1220" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">crea e inyecta</text>
<text x="1420" y="1254" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">el adaptador</text>
<text x="100" y="1615" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">Contrato definido en Aplicación.</text>
<text x="100" y="1663" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">La composición conecta caso de uso y adaptador.</text>
<text x="100" y="1711" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">El servidor autoriza y confirma la reserva.</text>
<rect x="700" y="1930" width="600" height="220" fill="#f1f2f5" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1000" y="1976" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#202124">Operaciones de negocio</text>
<text x="1000" y="2023" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Contenedor de C2 · Edge Function / TypeScript</text>
<text x="1000" y="2060" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Verifica la sesión y ejecuta ConfirmarReserva.</text>
<text x="1000" y="2097" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Devuelve confirmación, conflicto o error.</text>
<path d="M1000 1550V1930" fill="none" stroke="#505050" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="1025" y="1804" width="427.40000000000003" height="73" fill="#fffffa" stroke="#fffffa" stroke-width="1.8"/>
<text x="1030" y="1830" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">solicita confirmar en servidor</text>
<text x="1030" y="1864" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">HTTPS con sesión del usuario</text>
<text x="55" y="2225" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#202124">Continua: colaboración durante la operación. Discontinua: construcción y conexión de dependencias.</text>
<text x="55" y="2272" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#202124">El resultado regresa por el mismo recorrido. El interior del servidor queda fuera de esta vista de la aplicación móvil.</text>
</svg>