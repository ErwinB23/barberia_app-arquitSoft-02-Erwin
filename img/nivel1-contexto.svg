<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1460" viewBox="0 0 2100 1460"><title>C1 · Contexto de App Barbería</title><desc>Vista de contexto con tres roles y cuatro dependencias externas: Google, Resend, correo de acceso y mapas. Todas las capacidades representadas pertenecen al alcance de la propuesta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52667d"/></marker></defs><rect width="2100" height="1460" fill="white"/><rect width="2100" height="155" fill="#162b47"/>
<text x="48" y="64" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="white">C1 · Contexto de App Barbería</text>
<text x="48" y="117" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#d8e5f5">Sistema completo: personas y sistemas externos, con relaciones de negocio.</text>
<rect x="50" y="230" width="430" height="235" rx="14" fill="#eef5ff" stroke="#2468c9" stroke-width="2"/>
<g transform="translate(72 256) scale(1.4)" fill="none" stroke="#2468c9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M3 24v-5c0-7 18-7 18 0v5"/></g>
<text x="128" y="285" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#2468c9">Cliente</text>
<text x="72" y="328" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52667d">Persona</text>
<text x="72" y="374" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">Explora, reserva y consulta pagos.</text>
<text x="72" y="409" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">Busca en mapas y valora</text>
<text x="72" y="444" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">sus atenciones completadas.</text>
<rect x="50" y="560" width="430" height="235" rx="14" fill="#eef5ff" stroke="#2468c9" stroke-width="2"/>
<g transform="translate(72 586) scale(1.4)" fill="none" stroke="#2468c9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M3 24v-5c0-7 18-7 18 0v5"/></g>
<text x="128" y="615" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#2468c9">Barbero</text>
<text x="72" y="658" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52667d">Persona</text>
<text x="72" y="704" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">Gestiona agenda y atenciones.</text>
<text x="72" y="739" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">Verifica y confirma pagos</text>
<text x="72" y="774" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">de sus citas asignadas.</text>
<rect x="50" y="890" width="430" height="270" rx="14" fill="#eef5ff" stroke="#2468c9" stroke-width="2"/>
<g transform="translate(72 916) scale(1.4)" fill="none" stroke="#2468c9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M3 24v-5c0-7 18-7 18 0v5"/></g>
<text x="128" y="945" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#2468c9">Administrador</text>
<text x="72" y="988" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52667d">Persona de una barbería</text>
<text x="72" y="1034" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">Gestiona oferta, imágenes</text>
<text x="72" y="1069" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">y personal de su establecimiento.</text>
<text x="72" y="1104" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">Confirma pagos y registra</text>
<text x="72" y="1139" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">reembolsos de su barbería.</text>
<rect x="825" y="510" width="500" height="375" rx="14" fill="#eaf8f2" stroke="#008673" stroke-width="2"/>
<g transform="translate(847 536) scale(1.4)" fill="none" stroke="#008673" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="1" width="15" height="24" rx="3"/><path d="M10 5h5M11 21h3"/></g>
<text x="903" y="565" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#008673">App Barbería</text>
<text x="847" y="608" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52667d">Sistema de software · multitenant</text>
<text x="847" y="654" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">Gestiona oferta, disponibilidad,</text>
<text x="847" y="689" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">reservas, atención y pagos manuales.</text>
<text x="847" y="724" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">Incluye reseñas, mapas, imágenes</text>
<text x="847" y="759" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">y notificaciones.</text>
<text x="847" y="836" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#008673">Permisos por usuario y barbería.</text>
<rect x="1620" y="210" width="430" height="215" rx="14" fill="#f4f6f8" stroke="#52667d" stroke-width="2"/>
<g transform="translate(1642 236) scale(1.4)" fill="none" stroke="#52667d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M12 12l11 11M18 18l3-3M21 21l3-3"/></g>
<text x="1698" y="265" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#52667d">Google</text>
<text x="1642" y="308" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52667d">Sistema externo</text>
<text x="1642" y="354" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">Permite el inicio de sesión</text>
<text x="1642" y="389" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">con una cuenta Google.</text>
<rect x="1620" y="490" width="430" height="215" rx="14" fill="#f4f6f8" stroke="#52667d" stroke-width="2"/>
<g transform="translate(1642 516) scale(1.4)" fill="none" stroke="#52667d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="24" height="19" rx="2"/><path d="M2 5l11 10L24 5"/></g>
<text x="1698" y="545" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#52667d">Resend</text>
<text x="1642" y="588" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52667d">Sistema externo</text>
<text x="1642" y="634" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">Entrega correos de invitación</text>
<text x="1642" y="669" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">al personal de la barbería.</text>
<rect x="1620" y="770" width="430" height="250" rx="14" fill="#f4f6f8" stroke="#52667d" stroke-width="2"/>
<g transform="translate(1642 796) scale(1.4)" fill="none" stroke="#52667d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="24" height="19" rx="2"/><path d="M2 5l11 10L24 5"/></g>
<text x="1698" y="825" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#52667d">Correo de acceso</text>
<text x="1642" y="868" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52667d">Sistema externo</text>
<text x="1642" y="914" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364f">Confirmación de correo</text>
<text x="1642" y="949" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364f">y recuperación de acceso.</text>
<text x="1642" y="984" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#20364f">Proveedor configurado en Auth.</text>
<rect x="1620" y="1085" width="430" height="215" rx="14" fill="#f4f6f8" stroke="#52667d" stroke-width="2"/>
<g transform="translate(1642 1111) scale(1.4)" fill="none" stroke="#52667d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 25S3 15 3 10a10 10 0 0 1 20 0c0 5-10 15-10 15z"/><circle cx="13" cy="10" r="3"/></g>
<text x="1698" y="1140" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#52667d">Mapas y ubicación</text>
<text x="1642" y="1183" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52667d">Sistema externo</text>
<text x="1642" y="1229" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">Mapas y geocodificación.</text>
<text x="1642" y="1264" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">Proveedor por seleccionar.</text>
<path d="M480 347H670V580H825" fill="none" stroke="#52667d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="500" y="270" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52667d">Consulta oferta, reserva</text>
<text x="500" y="305" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52667d">y publica reseñas</text>
<path d="M480 677H825" fill="none" stroke="#52667d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="500" y="620" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52667d">Gestiona agenda y atención;</text>
<text x="500" y="655" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52667d">confirma pagos asignados</text>
<path d="M480 1025H670V790H825" fill="none" stroke="#52667d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="500" y="1080" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52667d">Administra oferta, personal</text>
<text x="500" y="1115" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52667d">y pagos de su barbería</text>
<path d="M1325 555H1380V317H1620" fill="none" stroke="#52667d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1398" y="239" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52667d">Permite acceso con</text>
<text x="1398" y="274" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52667d">una cuenta Google</text>
<path d="M1325 635H1620" fill="none" stroke="#52667d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1347" y="578" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52667d">Solicita el envío</text>
<text x="1347" y="613" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52667d">de invitaciones</text>
<path d="M1325 820H1620" fill="none" stroke="#52667d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1347" y="715" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#52667d">Solicita mensajes</text>
<text x="1347" y="750" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#52667d">de confirmación de correo</text>
<text x="1347" y="785" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#52667d">y recuperación de acceso</text>
<path d="M1250 885V1192H1620" fill="none" stroke="#52667d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1290" y="1110" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#52667d">Consulta mapas y ubicaciones</text>
<text x="1290" y="1145" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#52667d">para búsqueda por proximidad</text>
<path d="M48 1350H2050" stroke="#d6e1ee" stroke-width="2"/>
<text x="48" y="1393" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52667d">Azul: personas. Verde: sistema en estudio. Gris: sistemas externos. Las flechas indican uso; la respuesta vuelve por la misma relación.</text>
<text x="48" y="1435" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52667d">Mapas, reseñas e imágenes forman parte del alcance. El detalle interno de App Barbería se presenta en C2.</text>
</svg>