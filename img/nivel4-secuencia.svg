<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1720" viewBox="0 0 2400 1720" role="img" aria-labelledby="title desc">
<title id="title">Secuencia · Solicitud y respuesta de una reserva · App Barbería</title>
<desc id="desc">Vista dinámica complementaria. La demo simula el backend; el diagrama muestra la interacción prevista con el servidor.</desc>
<rect width="2400" height="1720" fill="white"/>
<rect x="0" y="0" width="2400" height="140" rx="0" fill="#162b47" stroke="#162b47" stroke-width="2"/>
<text x="42.0" y="21.0" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="white" dominant-baseline="text-before-edge">Secuencia · Solicitud y respuesta de una reserva</text>
<text x="44.0" y="87.0" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#d5e4ed" dominant-baseline="text-before-edge">Vista dinámica complementaria. La demo simula el backend; el diagrama muestra la interacción prevista con el servidor.</text>
<rect x="45" y="195" width="390" height="110" rx="12" fill="#eef5ff" stroke="#2468c9" stroke-width="2"/>
<text x="143.0" y="209.0" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#2468c9" dominant-baseline="text-before-edge">Presentación</text>
<text x="157.0" y="259.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">Aplicación móvil</text>
<path d="M240 305V1510" stroke="#cbd8e5" stroke-width="2.5" stroke-dasharray="9 9"/>
<rect x="525" y="195" width="390" height="110" rx="12" fill="#f3effb" stroke="#7052b8" stroke-width="2"/>
<text x="620.5" y="209.0" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#7052b8" dominant-baseline="text-before-edge">CrearReserva</text>
<text x="654.5" y="259.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">Caso de uso</text>
<path d="M720 305V1510" stroke="#cbd8e5" stroke-width="2.5" stroke-dasharray="9 9"/>
<rect x="1005" y="195" width="390" height="110" rx="12" fill="#fff5e5" stroke="#926018" stroke-width="2"/>
<text x="1123.0" y="209.0" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#926018" dominant-baseline="text-before-edge">Adaptador</text>
<text x="1063.0" y="259.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">SupabaseReservaAdapter</text>
<path d="M1200 305V1510" stroke="#cbd8e5" stroke-width="2.5" stroke-dasharray="9 9"/>
<rect x="1485" y="195" width="390" height="110" rx="12" fill="#eaf8f2" stroke="#147d68" stroke-width="2"/>
<text x="1586.0" y="209.0" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#147d68" dominant-baseline="text-before-edge">API de datos</text>
<text x="1620.0" y="259.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">PostgREST</text>
<path d="M1680 305V1510" stroke="#cbd8e5" stroke-width="2.5" stroke-dasharray="9 9"/>
<rect x="1965" y="195" width="390" height="110" rx="12" fill="#eaf8f2" stroke="#147d68" stroke-width="2"/>
<text x="2070.5" y="209.0" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#147d68" dominant-baseline="text-before-edge">PostgreSQL</text>
<text x="2116.5" y="259.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">Servidor</text>
<path d="M2160 305V1510" stroke="#cbd8e5" stroke-width="2.5" stroke-dasharray="9 9"/>
<g data-relation="ui-crear"><polyline points="240,420 720,420" fill="none" stroke="#2468c9" stroke-width="3.5" stroke-linejoin="round"/>
<polygon points="720.0,420.0 704.0,412.0 704.0,428.0" fill="#2468c9" stroke="#2468c9" stroke-width="2"/>
<text x="265.0" y="335.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#2468c9" dominant-baseline="text-before-edge">1. Entrega datos</text>
<text x="265.0" y="366.2" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#2468c9" dominant-baseline="text-before-edge">ejecutar(entrada)</text>
</g>
<g data-relation="crear-adapter"><polyline points="720,625 1200,625" fill="none" stroke="#7052b8" stroke-width="3.5" stroke-linejoin="round"/>
<polygon points="1200.0,625.0 1184.0,617.0 1184.0,633.0" fill="#7052b8" stroke="#7052b8" stroke-width="2"/>
<text x="745.0" y="540.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#7052b8" dominant-baseline="text-before-edge">2. Solicita confirmación</text>
<text x="745.0" y="571.2" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#7052b8" dominant-baseline="text-before-edge">confirmar(solicitud)</text>
</g>
<g data-relation="adapter-api"><polyline points="1200,760 1680,760" fill="none" stroke="#2468c9" stroke-width="3.5" stroke-linejoin="round"/>
<polygon points="1680.0,760.0 1664.0,752.0 1664.0,768.0" fill="#2468c9" stroke="#2468c9" stroke-width="2"/>
<text x="1225.0" y="675.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#2468c9" dominant-baseline="text-before-edge">3. Invoca RPC</text>
<text x="1225.0" y="706.2" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#2468c9" dominant-baseline="text-before-edge">HTTPS · create_reservation</text>
</g>
<g data-relation="api-db"><polyline points="1680,895 2160,895" fill="none" stroke="#147d68" stroke-width="3.5" stroke-linejoin="round"/>
<polygon points="2160.0,895.0 2144.0,887.0 2144.0,903.0" fill="#147d68" stroke="#147d68" stroke-width="2"/>
<text x="1705.0" y="810.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#147d68" dominant-baseline="text-before-edge">4. Ejecuta función</text>
<text x="1705.0" y="841.2" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#147d68" dominant-baseline="text-before-edge">SQL · create_reservation</text>
</g>
<rect x="520" y="435" width="400" height="95" rx="12" fill="#f3effb" stroke="#7052b8" stroke-width="2"/>
<text x="539.0" y="449.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#7052b8" dominant-baseline="text-before-edge">Normaliza y valida la entrada.</text>
<text x="539.0" y="477.8" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#7052b8" dominant-baseline="text-before-edge">Si es inválida, detiene la llamada.</text>
<rect x="1945" y="930" width="410" height="125" rx="12" fill="#eaf8f2" stroke="#147d68" stroke-width="2"/>
<text x="1960.0" y="944.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#147d68" dominant-baseline="text-before-edge">Revalida permisos, reglas</text>
<text x="1960.0" y="974.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#147d68" dominant-baseline="text-before-edge">y disponibilidad. Guarda</text>
<text x="1960.0" y="1004.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#147d68" dominant-baseline="text-before-edge">todo en una transacción.</text>
<g data-relation="db-api"><polyline points="2160,1160 1680,1160" fill="none" stroke="#147d68" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="10 8"/>
<polygon points="1680.0,1160.0 1696.0,1168.0 1696.0,1152.0" fill="#147d68" stroke="#147d68" stroke-width="2"/>
<text x="1705.0" y="1082.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#147d68" dominant-baseline="text-before-edge">5. Devuelve identificador</text>
<text x="1705.0" y="1113.2" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#147d68" dominant-baseline="text-before-edge">UUID de reserva</text>
</g>
<g data-relation="api-adapter"><polyline points="1680,1270 1200,1270" fill="none" stroke="#147d68" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="10 8"/>
<polygon points="1200.0,1270.0 1216.0,1278.0 1216.0,1262.0" fill="#147d68" stroke="#147d68" stroke-width="2"/>
<text x="1225.0" y="1192.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#147d68" dominant-baseline="text-before-edge">6. Respuesta de la RPC</text>
</g>
<g data-relation="adapter-crear"><polyline points="1200,1380 720,1380" fill="none" stroke="#147d68" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="10 8"/>
<polygon points="720.0,1380.0 736.0,1388.0 736.0,1372.0" fill="#147d68" stroke="#147d68" stroke-width="2"/>
<text x="745.0" y="1302.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#147d68" dominant-baseline="text-before-edge">7. ResultadoReserva</text>
<text x="745.0" y="1333.2" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#147d68" dominant-baseline="text-before-edge">Éxito o error comprensible</text>
</g>
<g data-relation="crear-ui"><polyline points="720,1490 240,1490" fill="none" stroke="#147d68" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="10 8"/>
<polygon points="240.0,1490.0 256.0,1498.0 256.0,1482.0" fill="#147d68" stroke="#147d68" stroke-width="2"/>
<text x="265.0" y="1412.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#147d68" dominant-baseline="text-before-edge">8. Devuelve el resultado</text>
</g>
<rect x="45" y="1525" width="2310" height="75" rx="12" fill="#f7f9fc" stroke="#cbd8e5" stroke-width="2"/>
<text x="63.0" y="1543.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">La presentación informa confirmación o error. Ante conflicto: horario ocupado. Si se pierde la respuesta, consultar citas antes de reenviar.</text>
<path d="M40 1616H2360" stroke="#cbd8e5"/>
<text x="44.0" y="1634.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">Línea continua: solicitud. Línea discontinua: respuesta. El servidor confirma la operación de forma completa.</text>
<text x="44.0" y="1671.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">Elegir efectivo o Yape registra el medio elegido; la recepción del pago se confirma manualmente.</text>
</svg>