<text x="792" y="2343" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#202124">1</text>
<text x="835" y="2344" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#202124">Autenticación y sesión · HTTPS → Supabase Auth.</text>
