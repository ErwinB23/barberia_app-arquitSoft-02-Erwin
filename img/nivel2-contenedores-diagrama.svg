<text x="77" y="2150" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">Servicios y almacenes administrados en Supabase; el núcleo del negocio conserva contratos propios.</text>
<text x="770" y="2282" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202124">RELACIONES DE AMBOS CLIENTES</text>
