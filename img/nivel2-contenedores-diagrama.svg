<text x="792" y="2395" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#202124">2</text>
<text x="835" y="2396" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#202124">Operaciones críticas y vínculos de imágenes · HTTPS → servidor.</text>
<circle cx="792" cy="2438" r="23" fill="#eeebff" stroke="#9d8af4" stroke-width="1.5"/>
<text x="792" y="2447" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#202124">3</text>
<text x="835" y="2448" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#202124">Consultas autorizadas · HTTPS / REST → API de datos.</text>
<circle cx="792" cy="2490" r="23" fill="#eeebff" stroke="#9d8af4" stroke-width="1.5"/>
<text x="792" y="2499" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#202124">4</text>
<text x="835" y="2500" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#202124">Archivos: carga y lectura · HTTPS → Storage con RLS.</text>
<circle cx="792" cy="2542" r="23" fill="#eeebff" stroke="#9d8af4" stroke-width="1.5"/>
<text x="792" y="2551" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#202124">5</text>
<text x="835" y="2552" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#202124">Mapas y ubicaciones · HTTPS → proveedor de mapas.</text>
<text x="60" y="2610" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#202124">Las flechas indican solicitudes; las respuestas regresan por la misma relación. Puente: cruce sin conexión.</text>
<text x="60" y="2652" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="start" fill="#202124">Los números identifican relaciones, no pasos. Los tres roles de C1 usan los clientes según sus permisos. Mapas está incluido en el alcance.</text>
