<svg xmlns="http://www.w3.org/2000/svg" width="2700" height="2690" viewBox="0 0 2700 2690"><title>C2 · Contenedores de App Barbería</title><desc>Clientes móvil y web, Auth, función de operaciones de negocio, PostgREST, PostgreSQL y Storage. Las operaciones críticas pasan por el servidor. Google, Resend, correo de acceso y mapas quedan fuera del límite del sistema.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#505050"/></marker></defs><rect width="2700" height="2690" fill="white"/>
