<text x="380" y="1844" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#202124">Supabase Storage</text>
<text x="380" y="1889" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Contenedor · almacén de objetos</text>
<text x="380" y="1924" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Archivos de imágenes en buckets.</text>
<text x="380" y="1959" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Carga y lectura con políticas RLS.</text>
<text x="380" y="1994" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Los archivos no se guardan en tablas.</text>
