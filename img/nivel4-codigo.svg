<text x="942" y="1057" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7052b8" dominant-baseline="text-before-edge">implementa</text>
<rect x="65" y="1480" width="1670" height="140" rx="16" fill="#ffffff" stroke="#d6e1ee" stroke-width="2"/>
<polyline points="102.375,1510.59375 102.375,1522.8125" fill="none" stroke="#2468c9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
