<svg xmlns="http://www.w3.org/2000/svg" width="2700" height="1990" viewBox="0 0 2700 1990"><title>C4 · Código de Coordinación de reservas · App Barbería</title><desc>Propuesta de código del componente cliente Coordinación de reservas. SolicitarReserva utiliza ReservaRemotaGateway y validaciones de dominio. ReservaHttpAdapter implementa el contrato y envía HTTPS con sesión a una Edge Function. Dependencias hacia el núcleo.</desc><defs><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7854bb"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#008673"/></marker><marker id="real" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L12 7L1 13Z" fill="white" stroke="#7854bb" stroke-width="1.4"/></marker></defs><rect width="2700" height="1990" fill="white"/><rect width="2700" height="160" fill="#162b47"/>
<text x="48" y="67" font-family="Arial,sans-serif" font-size="47" font-weight="700" fill="white">C4 · Código de Coordinación de reservas</text>
<text x="48" y="123" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#d8e5f5">Detalle del componente móvil de C3. Clases, contrato y tipos propios: las dependencias apuntan hacia el núcleo.</text>
<rect x="50" y="230" width="2600" height="600" rx="14" fill="#fcfaff" stroke="#7854bb" stroke-width="2" stroke-dasharray="11 8"/>
<text x="75" y="278" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#7854bb">COORDINACIÓN DE RESERVAS · componente en detalle · Aplicación del cliente</text>
<rect x="110" y="330" width="1020" height="420" rx="14" fill="#f3effb" stroke="#7854bb" stroke-width="2" />
<text x="135" y="369" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52667d">Clase · aplicación</text>
<g transform="translate(135 394)" fill="none" stroke="#7854bb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L0 16l10 13M27 3l10 13-10 13M23 0L14 32"/></g>
<text x="192" y="425" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#7854bb">SolicitarReserva</text>
<text x="135" y="477" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#20364f">Valida la entrada y solicita confirmar la reserva.</text>
<path d="M135 500h970" stroke="#d6e1ee" stroke-width="2"/>
<text x="135" y="545" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364f">− gateway: ReservaRemotaGateway</text>
<text x="135" y="585" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364f">+ constructor(gateway: ReservaRemotaGateway)</text>
<text x="135" y="625" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364f">+ ejecutar(entrada: unknown): Promise&lt;ResultadoReserva&gt;</text>
<text x="135" y="700" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364f">La entrada inválida se convierte en un resultado de error propio.</text>
<rect x="1610" y="330" width="980" height="330" rx="14" fill="#f3effb" stroke="#7854bb" stroke-width="2" />
<text x="1635" y="369" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52667d">Interfaz / puerto propio · aplicación</text>
<g transform="translate(1635 394)" fill="none" stroke="#7854bb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L0 16l10 13M27 3l10 13-10 13M23 0L14 32"/></g>
<text x="1692" y="425" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#7854bb">ReservaRemotaGateway</text>
<text x="1635" y="477" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#20364f">Define una solicitud completa al servidor.</text>
<path d="M1635 500h930" stroke="#d6e1ee" stroke-width="2"/>
<text x="1635" y="550" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#20364f">+ confirmar(solicitud: SolicitudReserva):</text>
<text x="1635" y="590" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#20364f">    Promise&lt;ResultadoReserva&gt;</text>
<path d="M1130 520H1610" fill="none" stroke="#7854bb" stroke-width="3"  marker-end="url(#purple)"/>
<text x="1250" y="480" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#7854bb">Usa el contrato</text>
<rect x="50" y="1040" width="1500" height="800" rx="14" fill="#fbfefd" stroke="#008673" stroke-width="2" stroke-dasharray="11 8"/>
<text x="75" y="1084" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#008673">MODELO DE RESERVA · dominio</text>
<text x="75" y="1126" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52667d">Componente vecino</text>
<rect x="110" y="1170" width="1380" height="230" rx="14" fill="#eaf8f2" stroke="#008673" stroke-width="2" />
<text x="135" y="1209" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52667d">Función independiente · dominio</text>
<g transform="translate(135 1234)" fill="none" stroke="#008673" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L0 16l10 13M27 3l10 13-10 13M23 0L14 32"/></g>
<text x="192" y="1265" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#008673">normalizarSolicitud</text>
<text x="135" y="1311" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#20364f">(entrada: unknown): SolicitudReserva</text>
<text x="135" y="1362" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364f">Comprueba formato, servicios, horario y medio; produce un error propio si la entrada es inválida.</text>
<path d="M900 750V1170" fill="none" stroke="#008673" stroke-width="3"  marker-end="url(#green)"/>
<text x="930" y="930" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#008673">Usa validaciones</text>
<text x="930" y="970" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#008673">y tipos propios</text>
<rect x="110" y="1440" width="660" height="270" rx="14" fill="#eaf8f2" stroke="#008673" stroke-width="2" />
<text x="135" y="1479" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52667d">Tipo propio · dominio</text>
<g transform="translate(135 1504)" fill="none" stroke="#008673" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L0 16l10 13M27 3l10 13-10 13M23 0L14 32"/></g>
<text x="192" y="1535" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#008673">SolicitudReserva</text>
<text x="135" y="1570" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">barbershopId: string · barberId: string | null</text>
<text x="135" y="1610" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">items: ItemReserva[] · startsAt: string</text>
<text x="135" y="1650" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">paymentMethod: "cash" | "yape"</text>
<rect x="810" y="1440" width="680" height="270" rx="14" fill="#eaf8f2" stroke="#008673" stroke-width="2" />
<text x="835" y="1479" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52667d">Unión de tipos · dominio</text>
<g transform="translate(835 1504)" fill="none" stroke="#008673" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L0 16l10 13M27 3l10 13-10 13M23 0L14 32"/></g>
<text x="892" y="1535" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#008673">ResultadoReserva</text>
<text x="835" y="1570" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">Éxito: { ok: true; reservaId: string }</text>
<text x="835" y="1610" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">Fallo: { ok: false; codigo: CodigoErrorReserva;</text>
<text x="835" y="1650" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">mensaje: string }</text>
<text x="85" y="1758" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52667d">ItemReserva agrupa servicio y estilo opcional. barberId = null permite elegir «cualquiera».</text>
<text x="85" y="1798" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52667d">CodigoErrorReserva representa errores propios de la aplicación, sin exponer códigos SQL.</text>
<text x="1770" y="1084" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#a36612">ADAPTADOR HTTP · componente vecino</text>
<rect x="1770" y="1170" width="870" height="380" rx="14" fill="#fff5e7" stroke="#a36612" stroke-width="2" />
<text x="1795" y="1209" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52667d">Clase · infraestructura del cliente</text>
<g transform="translate(1795 1234)" fill="none" stroke="#a36612" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L0 16l10 13M27 3l10 13-10 13M23 0L14 32"/></g>
<text x="1852" y="1265" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#a36612">ReservaHttpAdapter</text>
<text x="1795" y="1311" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364f">Implementa el contrato remoto y traduce datos y errores.</text>
<path d="M1795 1336h820" stroke="#d6e1ee" stroke-width="2"/>
<text x="1795" y="1383" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364f">+ confirmar(solicitud: SolicitudReserva):</text>
<text x="1795" y="1423" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364f">    Promise&lt;ResultadoReserva&gt;</text>
<text x="1795" y="1496" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364f">Envía HTTPS con la sesión a la Edge Function.</text>
<path d="M2450 1170V660" fill="none" stroke="#7854bb" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#real)"/>
<text x="2130" y="940" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#7854bb">Implementa</text>
<text x="2130" y="980" font-family="Arial,sans-serif" font-size="29" font-weight="400" fill="#7854bb">el contrato</text>
<text x="1770" y="1630" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364f">Composición construye el adaptador y lo entrega</text>
<text x="1770" y="1670" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364f">a SolicitarReserva al iniciar el flujo.</text>
<text x="1770" y="1710" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364f">El servidor verifica identidad, permisos y disponibilidad.</text>
<path d="M50 1880h2600" stroke="#d6e1ee" stroke-width="2"/>
<text x="50" y="1921" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52667d">Flecha continua: uso de código. Discontinua con triángulo: implementación de interfaz. Esta vista no muestra el orden de ejecución.</text>
<text x="50" y="1965" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52667d">unknown: entrada por validar. Promise: resultado asíncrono. Aplicación y Dominio conservan su independencia de HTTP, frameworks y SDK.</text>
</svg>