<text x="110.0" y="966.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">Función independiente · dominio</text>
<text x="160.0" y="1004.8" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#147d68" dominant-baseline="text-before-edge">normalizarSolicitud</text>
<text x="112.0" y="1061.8" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Revisa el formato y los datos básicos; rechaza entradas inválidas.</text>
<path d="M108 1107.25H1262" stroke="#cbd8e5"/>
<text x="112.0" y="1122.2" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">(entrada: unknown): SolicitudReserva</text>
</g>
<g data-node="solicitud">
<rect x="90" y="1190" width="550" height="250" rx="12" fill="#eaf8f2" stroke="#147d68" stroke-width="2"/>
<g transform="translate(108 1237)" fill="none" stroke="#147d68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 7L1 19l10 12M25 7l10 12-10 12M22 2l-8 34"/></g>
<text x="110.0" y="1206.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">Tipo · dominio</text>
<text x="160.0" y="1244.8" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#147d68" dominant-baseline="text-before-edge">SolicitudReserva</text>
<text x="112.0" y="1301.8" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Datos necesarios para solicitar la cita.</text>
<path d="M108 1347.25H622" stroke="#cbd8e5"/>
<text x="112.0" y="1362.2" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">barberId, items, startsAt</text>
<text x="112.0" y="1393.5" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">paymentMethod: cash | yape</text>
</g>
<g data-node="resultado">
<rect x="690" y="1190" width="590" height="250" rx="12" fill="#eaf8f2" stroke="#147d68" stroke-width="2"/>
<g transform="translate(708 1237)" fill="none" stroke="#147d68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 7L1 19l10 12M25 7l10 12-10 12M22 2l-8 34"/></g>
<text x="710.0" y="1206.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">Unión de tipos · dominio</text>
<text x="760.0" y="1244.8" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#147d68" dominant-baseline="text-before-edge">ResultadoReserva</text>
<text x="712.0" y="1301.8" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Respuesta de la operación.</text>
<path d="M708 1347.25H1262" stroke="#cbd8e5"/>
<text x="712.0" y="1362.2" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Éxito: ok = true, reservaId</text>
<text x="712.0" y="1393.5" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Fallo: ok = false, codigo, mensaje</text>
</g>
<g data-node="adapter">
<rect x="1540" y="950" width="780" height="300" rx="12" fill="#fff5e5" stroke="#926018" stroke-width="2"/>
<g transform="translate(1558 997)" fill="none" stroke="#926018" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 7L1 19l10 12M25 7l10 12-10 12M22 2l-8 34"/></g>
<text x="1560.0" y="966.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">Clase · Adaptador de reservas · infraestructura</text>
<text x="1610.0" y="1004.8" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#926018" dominant-baseline="text-before-edge">SupabaseReservaAdapter</text>
<text x="1562.0" y="1061.8" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Convierte los datos e invoca la RPC create_reservation.</text>
<path d="M1558 1107.25H2302" stroke="#cbd8e5"/>
<text x="1562.0" y="1122.2" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">confirmar(solicitud: SolicitudReserva):</text>
<text x="1562.0" y="1153.5" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Promise&lt;ResultadoReserva&gt;</text>
</g>
<g data-relation="crear-gateway"><polyline points="910,455 1370,455" fill="none" stroke="#7052b8" stroke-width="3.5" stroke-linejoin="round"/>
<polygon points="1370.0,455.0 1354.0,447.0 1354.0,463.0" fill="#7052b8" stroke="#7052b8" stroke-width="2"/>
<text x="985.0" y="400.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#7052b8" dominant-baseline="text-before-edge">Usa el contrato</text>
</g>
<g data-relation="crear-normalizar"><polyline points="850,620 850,950" fill="none" stroke="#147d68" stroke-width="3.5" stroke-linejoin="round"/>
<polygon points="850.0,950.0 858.0,934.0 842.0,934.0" fill="#147d68" stroke="#147d68" stroke-width="2"/>
<text x="895.0" y="752.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#147d68" dominant-baseline="text-before-edge">Llama para validar</text>
<text x="895.0" y="783.2" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#147d68" dominant-baseline="text-before-edge">la entrada</text>
</g>
<g data-relation="adapter-gateway"><polyline points="1850,950 1850,620" fill="none" stroke="#7052b8" stroke-width="3.5" stroke-linejoin="round" stroke-dasharray="10 8"/>
<polygon points="1850.0,620.0 1842.0,636.0 1858.0,636.0" fill="white" stroke="#7052b8" stroke-width="2"/>
<text x="1880.0" y="752.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#7052b8" dominant-baseline="text-before-edge">Implementa</text>
<text x="1880.0" y="783.2" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#7052b8" dominant-baseline="text-before-edge">el contrato</text>
</g>
<text x="1544.0" y="1305.0" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">El caso de uso conoce el contrato. Composición le entrega</text>
<text x="1544.0" y="1341.2" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">el adaptador concreto.</text>
<path d="M40 1476H2360" stroke="#cbd8e5"/>
<text x="44.0" y="1494.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">Flecha continua: usa o llama. Línea discontinua con triángulo: la clase implementa la interfaz.</text>
<text x="44.0" y="1531.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">Promise: resultado asíncrono. unknown: entrada aún por validar. Los tipos verdes se utilizan en las firmas de los métodos.</text>
</svg>