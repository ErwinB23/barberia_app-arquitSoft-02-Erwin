<polyline points="111.0,1538.625 111.0,1547.96875 121.78125,1547.96875" fill="none" stroke="#2468c9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="160" y="1509" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#20364f" dominant-baseline="text-before-edge">Composición: crea el adaptador y lo entrega al caso de uso.</text>
<text x="160" y="1559" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">La presentación llama a ejecutar(); no construye escrituras separadas para reserva, servicios y pago.</text>
<polyline points="65,1660 1735,1660" fill="none" stroke="#d6e1ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="65" y="1682" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#20364f" dominant-baseline="text-before-edge">NOTACIÓN Y LÍMITE</text>
<text x="65" y="1718" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">Flecha continua: referencia a un contrato. Discontinua: uso de tipos. Triángulo hueco: implementación.</text>
<text x="65" y="1751.12" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">La validación definitiva y la transacción se ejecutan en PostgreSQL, fuera de este código cliente.</text>
</svg>