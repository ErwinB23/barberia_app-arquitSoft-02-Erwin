<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1580" viewBox="0 0 2400 1580" role="img" aria-labelledby="title desc">
<title id="title">C4 · Código de Coordinación de reservas · App Barbería</title>
<desc id="desc">Abre el componente violeta de C3. Se muestran las clases, el contrato y los elementos de dominio que utiliza.</desc>
<rect width="2400" height="1580" fill="white"/>
<rect x="0" y="0" width="2400" height="140" rx="0" fill="#162b47" stroke="#162b47" stroke-width="2"/>
<text x="42.0" y="21.0" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="white" dominant-baseline="text-before-edge">C4 · Código de Coordinación de reservas</text>
<text x="44.0" y="87.0" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#d5e4ed" dominant-baseline="text-before-edge">Abre el componente violeta de C3. Se muestran las clases, el contrato y los elementos de dominio que utiliza.</text>
<rect x="40" y="205" width="2320" height="485" rx="14" fill="white" stroke="#7052b8" stroke-width="2" stroke-dasharray="10 7"/>
<text x="58.0" y="217.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7052b8" dominant-baseline="text-before-edge">COORDINACIÓN DE RESERVAS · componente en foco · TypeScript</text>
<g data-node="crear">
<rect x="90" y="310" width="820" height="310" rx="12" fill="#f3effb" stroke="#7052b8" stroke-width="2"/>
<g transform="translate(108 357)" fill="none" stroke="#7052b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 7L1 19l10 12M25 7l10 12-10 12M22 2l-8 34"/></g>
<text x="110.0" y="326.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">Clase · aplicación</text>
<text x="160.0" y="364.8" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#7052b8" dominant-baseline="text-before-edge">CrearReserva</text>
<text x="112.0" y="421.8" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Coordina la operación y recibe el contrato al construirse.</text>
<path d="M108 467.25H892" stroke="#cbd8e5"/>
<text x="112.0" y="482.2" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">gateway: ReservaTransaccionalGateway</text>
<text x="112.0" y="513.5" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">ejecutar(entrada: unknown):</text>
<text x="112.0" y="544.8" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Promise&lt;ResultadoReserva&gt;</text>
</g>
<g data-node="gateway">
<rect x="1370" y="310" width="940" height="310" rx="12" fill="#f3effb" stroke="#7052b8" stroke-width="2"/>
