<text x="1390.0" y="326.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">Interfaz · aplicación</text>
<text x="1440.0" y="364.8" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#7052b8" dominant-baseline="text-before-edge">ReservaTransaccionalGateway</text>
<text x="1392.0" y="421.8" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Define el acuerdo para confirmar una reserva completa.</text>
<path d="M1388 467.25H2292" stroke="#cbd8e5"/>
<text x="1392.0" y="482.2" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">confirmar(solicitud: SolicitudReserva):</text>
<text x="1392.0" y="513.5" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Promise&lt;ResultadoReserva&gt;</text>
</g>
<rect x="40" y="855" width="1290" height="605" rx="14" fill="white" stroke="#147d68" stroke-width="2" stroke-dasharray="10 7"/>
<text x="58.0" y="867.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#147d68" dominant-baseline="text-before-edge">MODELO DE RESERVA · dominio</text>
<g data-node="normalizar">
