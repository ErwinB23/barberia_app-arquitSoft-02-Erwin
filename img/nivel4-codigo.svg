<text x="721.25" y="1211" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#926018" dominant-baseline="text-before-edge">SupabaseReservaAdapter</text>
<polyline points="465,1258 1335,1258" fill="none" stroke="#d6e1ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472" y="1280" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">cliente: ClienteRpc</text>
<text x="472" y="1317" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">confirmar(solicitud): Promise&lt;ResultadoReserva&gt;</text>
<text x="472" y="1354" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Mapea campos y errores de la RPC</text>
<polyline points="900,1155 900,996" fill="none" stroke="#7052b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8"/>
