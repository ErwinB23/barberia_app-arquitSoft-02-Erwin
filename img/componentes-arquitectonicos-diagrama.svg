<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2890" viewBox="0 0 2000 2890"><title>Componentes arquitectónicos: confirmación de una reserva en App Barbería</title><desc>Colaboración de componentes del cliente y servidor: SolicitarReserva, adaptador HTTP, entrada autenticada en Edge Functions, ConfirmarReserva y adaptador de persistencia por RPC a PostgreSQL. Composición construye e inyecta las implementaciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#505050"/></marker></defs><rect width="2000" height="2890" fill="white"/>
<text x="1000" y="60" font-family="Arial,sans-serif" font-size="42" font-weight="700" text-anchor="middle" fill="#202124">Componentes arquitectónicos · Confirmar una reserva</text>
<text x="1000" y="109" font-family="Arial,sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#202124">Vista de colaboración entre componentes del cliente y del servidor.</text>
<rect x="60" y="195" width="1880" height="1010" fill="#ffffe6" stroke="#9d8af4" stroke-width="1.8" />
<text x="85" y="240" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#202124">APLICACIÓN MÓVIL · componentes internos del cliente</text>
<rect x="690" y="300" width="650" height="150" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8" />
<text x="1015" y="339" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#202124">Presentación de reservas</text>
<text x="1015" y="383" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Recoge servicios, barbero, horario y medio de pago</text>
<text x="1015" y="417" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Muestra confirmación, conflicto o error</text>
<rect x="690" y="600" width="650" height="175" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8" />
<text x="1015" y="639" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#202124">Coordinación de reservas · cliente</text>
<text x="1015" y="683" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Caso de uso SolicitarReserva</text>
<text x="1015" y="717" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Normaliza y valida la forma de entrada</text>
<text x="1015" y="751" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Solicita confirmar mediante un contrato</text>
<rect x="110" y="600" width="450" height="175" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8" />
<text x="335" y="639" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#202124">Modelo de reserva · cliente</text>
<text x="335" y="683" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">SolicitudReserva · ResultadoReserva</text>
<text x="335" y="717" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Tipos propios y validaciones puras</text>
<rect x="690" y="950" width="650" height="150" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8" />
<text x="1015" y="989" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#202124">Adaptador HTTP de reservas</text>
<text x="1015" y="1033" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">ReservaHttpAdapter</text>
<text x="1015" y="1067" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Convierte solicitudes, resultados y errores</text>
<rect x="1470" y="300" width="420" height="150" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8" />
<text x="1680" y="339" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#202124">Composición del cliente</text>
<text x="1680" y="383" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Construye el caso de uso</text>
<text x="1680" y="417" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">y le entrega el adaptador</text>
<path d="M1015 450V600" fill="none" stroke="#505050" stroke-width="2.3"  marker-end="url(#arrow)"/>
<rect x="1035" y="495" width="320.75" height="37" fill="#fffffa" stroke="#fffffa" stroke-width="1.8" />
<text x="1040" y="520" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">1. entrega la selección</text>
<path d="M690 687H560" fill="none" stroke="#505050" stroke-width="2.3"  marker-end="url(#arrow)"/>
<rect x="565" y="628" width="120.94000000000001" height="37" fill="#fffffa" stroke="#fffffa" stroke-width="1.8" />
<text x="570" y="650" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#202124">usa tipos</text>
<path d="M1015 775V950" fill="none" stroke="#505050" stroke-width="2.3"  marker-end="url(#arrow)"/>
<rect x="1035" y="825" width="413.5" height="69" fill="#fffffa" stroke="#fffffa" stroke-width="1.8" />
<text x="1040" y="850" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">2. solicita confirmación</text>
<text x="1040" y="882" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">Contrato: ReservaRemotaGateway</text>
<path d="M1540 450V687H1340" fill="none" stroke="#505050" stroke-width="2.3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<rect x="1550" y="547" width="211.04000000000002" height="37" fill="#fffffa" stroke="#fffffa" stroke-width="1.8" />
<text x="1555" y="570" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#202124">crea caso de uso</text>
<path d="M1810 450V1025H1340" fill="none" stroke="#505050" stroke-width="2.3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<rect x="1585" y="894" width="186.66" height="69" fill="#fffffa" stroke="#fffffa" stroke-width="1.8" />
<text x="1590" y="917" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#202124">crea e inyecta</text>
<text x="1590" y="949" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#202124">el adaptador</text>
<text x="110" y="1148" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">Núcleo: tipos, reglas y contratos propios.</text>
<text x="110" y="1185" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">Infraestructura: SDK y comunicación remota.</text>
<rect x="60" y="1370" width="1880" height="1370" fill="#ffffe6" stroke="#9d8af4" stroke-width="1.8" />
<text x="85" y="1415" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#202124">BACKEND ADMINISTRADO · SUPABASE</text>
<rect x="690" y="1480" width="650" height="150" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8" />
<text x="1015" y="1519" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#202124">Entrada HTTP · Edge Function</text>
<text x="1015" y="1563" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Verifica la sesión y obtiene identidad confiable</text>
<text x="1015" y="1597" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Convierte la petición a tipos propios del servidor</text>
<rect x="690" y="1800" width="650" height="195" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8" />
<text x="1015" y="1839" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#202124">Coordinación de reservas · servidor</text>
<text x="1015" y="1883" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Caso de uso ConfirmarReserva</text>
<text x="1015" y="1917" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Coordina autorización y reglas del negocio</text>
<text x="1015" y="1951" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Solicita una escritura atómica completa</text>
<rect x="110" y="1800" width="450" height="195" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8" />
<text x="335" y="1839" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#202124">Modelo de reserva · servidor</text>
<text x="335" y="1883" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">ContextoUsuario y tipos de reserva</text>
<text x="335" y="1917" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Reglas puras del negocio</text>
<text x="335" y="1951" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Sin SDK ni tipos de tablas</text>
<rect x="690" y="2160" width="650" height="150" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8" />
<text x="1015" y="2199" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#202124">Adaptador de persistencia</text>
<text x="1015" y="2243" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">PostgresReservaAdapter</text>
<text x="1015" y="2277" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Convierte parámetros y resultados de la RPC</text>
<rect x="1470" y="1480" width="420" height="150" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8" />
<text x="1680" y="1519" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#202124">Composición del servidor</text>
<text x="1680" y="1563" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">Construye el caso de uso</text>
<text x="1680" y="1597" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">y le entrega el adaptador</text>
<path d="M1015 1100V1480" fill="none" stroke="#505050" stroke-width="2.3"  marker-end="url(#arrow)"/>
<rect x="1035" y="1235" width="532.75" height="69" fill="#fffffa" stroke="#fffffa" stroke-width="1.8" />
<text x="1040" y="1260" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">3. solicita la confirmación al servidor</text>
<text x="1040" y="1292" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">HTTPS + sesión del usuario</text>
<path d="M1015 1630V1800" fill="none" stroke="#505050" stroke-width="2.3"  marker-end="url(#arrow)"/>
<rect x="1035" y="1677" width="307.5" height="69" fill="#fffffa" stroke="#fffffa" stroke-width="1.8" />
<text x="1040" y="1702" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">4. entrega solicitud</text>
<text x="1040" y="1734" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">e identidad verificada</text>
<path d="M690 1897H560" fill="none" stroke="#505050" stroke-width="2.3"  marker-end="url(#arrow)"/>
<rect x="565" y="1798" width="132.60000000000002" height="69" fill="#fffffa" stroke="#fffffa" stroke-width="1.8" />
<text x="570" y="1820" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#202124">usa reglas</text>
<text x="570" y="1852" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#202124">y tipos</text>
<path d="M1015 1995V2160" fill="none" stroke="#505050" stroke-width="2.3"  marker-end="url(#arrow)"/>
<rect x="1035" y="2045" width="453.25" height="69" fill="#fffffa" stroke="#fffffa" stroke-width="1.8" />
<text x="1040" y="2070" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">5. solicita persistencia completa</text>
<text x="1040" y="2102" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">Contrato: ReservaAtomicaGateway</text>
<path d="M1540 1630V1897H1340" fill="none" stroke="#505050" stroke-width="2.3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<rect x="1550" y="1742" width="211.04000000000002" height="37" fill="#fffffa" stroke="#fffffa" stroke-width="1.8" />
<text x="1555" y="1765" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#202124">crea caso de uso</text>
<path d="M1810 1630V2235H1340" fill="none" stroke="#505050" stroke-width="2.3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<rect x="1585" y="2087" width="186.66" height="69" fill="#fffffa" stroke="#fffffa" stroke-width="1.8" />
<text x="1590" y="2110" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#202124">crea e inyecta</text>
<text x="1590" y="2142" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#202124">el adaptador</text>
<rect x="690" y="2470" width="650" height="135" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8" />
<text x="1015" y="2509" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#202124">API de datos de Supabase</text>
<text x="1015" y="2553" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">PostgREST · ejecuta la función por RPC</text>
<text x="1015" y="2587" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#202124">La confirmación se realiza en una transacción</text>
<path d="M1015 2310V2470" fill="none" stroke="#505050" stroke-width="2.3"  marker-end="url(#arrow)"/>
<rect x="1035" y="2363" width="426.75" height="69" fill="#fffffa" stroke="#fffffa" stroke-width="1.8" />
<text x="1040" y="2388" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">6. invoca función PostgreSQL</text>
<text x="1040" y="2420" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">RPC a través de la API de datos</text>
<path d="M1490 2484C1490 2452 1890 2452 1890 2484V2656C1890 2688 1490 2688 1490 2656Z" fill="#eefff6" stroke="#008b69" stroke-width="2"/><ellipse cx="1690" cy="2484" rx="200" ry="24" fill="#eefff6" stroke="#008b69" stroke-width="2"/>
<text x="1690" y="2541" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#202124">PostgreSQL</text>
<text x="1690" y="2586" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Permisos sobre datos actuales</text>
<text x="1690" y="2619" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Disponibilidad y concurrencia</text>
<text x="1690" y="2652" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#202124">Escrituras atómicas e integridad</text>
<path d="M1340 2537H1490" fill="none" stroke="#505050" stroke-width="2.3"  marker-end="url(#arrow)"/>
<rect x="1375" y="2486" width="54.160000000000004" height="37" fill="#fffffa" stroke="#fffffa" stroke-width="1.8" />
<text x="1380" y="2510" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202124">SQL</text>
<text x="110" y="2708" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">La transacción conserva reserva, servicios, condiciones históricas, pago pendiente y avisos internos relacionados.</text>
<text x="75" y="2794" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">Línea continua: colaboración en ejecución. Línea discontinua: construcción e inyección de dependencias.</text>
<text x="75" y="2836" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">El resultado vuelve por el mismo recorrido. Las flechas no representan importaciones del código.</text>
<text x="75" y="2876" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">El pago queda pendiente hasta su confirmación manual por el barbero asignado o un administrador autorizado.</text>
</svg>