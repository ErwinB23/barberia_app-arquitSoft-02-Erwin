<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1550" viewBox="0 0 2000 1550" role="img" aria-labelledby="title desc">
<title id="title">Clean Architecture: el núcleo y sus adaptadores · App Barbería</title>
<desc id="desc">Vista de dependencias de código del módulo Reservas: la presentación invoca el caso de uso; infraestructura implementa el contrato de aplicación; aplicación usa los tipos y la validación del dominio. Composición conecta el adaptador y el caso de uso. Una vista separada muestra la ejecución: pantalla, CrearReserva, adaptador, API de datos y PostgreSQL.</desc>
<rect width="2000" height="1550" fill="#f7f9fc"/>
<rect x="0" y="0" width="2000" height="145" rx="0" fill="#162b47" stroke="#162b47" stroke-width="2"/>
<text x="48.0" y="17.0" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9cc4ff" dominant-baseline="text-before-edge">APP BARBERÍA · ENFOQUE ARQUITECTÓNICO</text>
<text x="46.0" y="53.0" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="white" dominant-baseline="text-before-edge">Clean Architecture: el núcleo y sus adaptadores</text>
<text x="48.0" y="110.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#d5e4ed" dominant-baseline="text-before-edge">Ejemplo del módulo Reservas · Responsabilidades separadas y dependencias hacia el interior</text>
<rect x="55" y="172" width="1890" height="66" rx="12" fill="white" stroke="#d5dfeb" stroke-width="2"/>
<g transform="translate(74 187)" fill="none" stroke="#147d68" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 1L3 8v12q0 12 17 19 17-7 17-19V8zM11 20l6 6 12-13"/></g>
<text x="131.0" y="190.0" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#162b47" dominant-baseline="text-before-edge">Regla central: el código exterior depende de Aplicación y Dominio.</text>
<text x="80.0" y="297.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2468c9" dominant-baseline="text-before-edge">BORDE · INTERFAZ DE USUARIO</text>
<text x="1510.0" y="297.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#926018" dominant-baseline="text-before-edge">BORDE · INTEGRACIONES</text>
<rect x="650" y="278" width="700" height="688" rx="20" fill="white" stroke="#c4b7e2" stroke-width="2" stroke-dasharray="10 7"/>
<text x="678.0" y="294.0" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#7052b8" dominant-baseline="text-before-edge">INTERIOR · CÓDIGO PROPIO</text>
<rect x="80" y="395" width="420" height="300" rx="15" fill="#eef5ff" stroke="#bbd2f5" stroke-width="2"/>
<g transform="translate(102 418)" fill="none" stroke="#2468c9" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="1" width="24" height="36" rx="4"/><path d="M14 6h10M16 31h6"/></g>
<text x="158.0" y="418.0" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#2468c9" dominant-baseline="text-before-edge">Presentación</text>
<text x="104.0" y="473.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">React Native / Expo</text>
<text x="104.0" y="520.0" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Muestra pantallas y recoge</text>
<text x="104.0" y="554.0" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">la selección del usuario.</text>
<text x="104.0" y="606.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Entrega datos al caso de uso.</text>
<rect x="710" y="351" width="580" height="275" rx="15" fill="#f3effb" stroke="#cec2e9" stroke-width="2"/>
<g transform="translate(732 371)" fill="none" stroke="#7052b8" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10L20 1l18 9-18 9zM2 20l18 9 18-9M2 29l18 9 18-9"/></g>
<text x="788.0" y="371.0" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#7052b8" dominant-baseline="text-before-edge">Aplicación</text>
<text x="735.0" y="425.0" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">CrearReserva coordina la confirmación.</text>
<text x="735.0" y="466.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Define qué necesita del exterior.</text>
<rect x="735" y="512" width="530" height="92" rx="10" fill="white" stroke="#cec2e9" stroke-width="2"/>
<text x="751.0" y="524.0" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#7052b8" dominant-baseline="text-before-edge">Contrato: confirmar(solicitud)</text>
<text x="751.0" y="565.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">ReservaTransaccionalGateway</text>
<rect x="710" y="788" width="580" height="143" rx="15" fill="#eaf8f2" stroke="#b4ded0" stroke-width="2"/>
<g transform="translate(732 804)" fill="none" stroke="#147d68" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 1L3 8v12q0 12 17 19 17-7 17-19V8zM11 20l6 6 12-13"/></g>
<text x="788.0" y="805.0" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#147d68" dominant-baseline="text-before-edge">Dominio</text>
<text x="735.0" y="852.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">SolicitudReserva · ResultadoReserva</text>
<text x="735.0" y="889.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Tipos propios y validación básica de entrada.</text>
<rect x="1510" y="395" width="410" height="300" rx="15" fill="#fff5e5" stroke="#e5d0a8" stroke-width="2"/>
<g transform="translate(1533 418)" fill="none" stroke="#926018" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 1v11M29 1v11M4 12h32v8q0 11-16 11T4 20zM20 31v8"/></g>
<text x="1588.0" y="418.0" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#926018" dominant-baseline="text-before-edge">Infraestructura</text>
<text x="1534.0" y="473.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">Adaptador de Supabase</text>
<text x="1534.0" y="520.0" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Convierte datos y errores</text>
<text x="1534.0" y="554.0" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">del proveedor.</text>
<text x="1534.0" y="606.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Utiliza el SDK y llama a la API.</text>
<polyline points="500,438 710,438" fill="none" stroke="#2468c9" stroke-width="4" stroke-linejoin="round"/>
<polygon points="710.0,438.0 693.0,430.0 693.0,446.0" fill="#2468c9"/>
<text x="515.0" y="355.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#2468c9" dominant-baseline="text-before-edge">Invoca</text>
<text x="515.0" y="384.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#2468c9" dominant-baseline="text-before-edge">caso de uso</text>
<polyline points="1510,558 1265,558" fill="none" stroke="#926018" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1265.0,558.0 1282.0,566.0 1282.0,550.0" fill="#926018"/>
<text x="1370.0" y="463.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#926018" dominant-baseline="text-before-edge">Implementa</text>
<text x="1370.0" y="492.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#926018" dominant-baseline="text-before-edge">el contrato</text>
<polyline points="1000,626 1000,788" fill="none" stroke="#147d68" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1000.0,788.0 1008.0,771.0 992.0,771.0" fill="#147d68"/>
<text x="1040.0" y="670.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#147d68" dominant-baseline="text-before-edge">Usa tipos y</text>
<text x="1040.0" y="701.5" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#147d68" dominant-baseline="text-before-edge">reglas propias</text>
<text x="80.0" y="735.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">Las flechas de esta vista indican</text>
<text x="80.0" y="765.2" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">qué parte del código conoce a otra.</text>
<text x="1510.0" y="735.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">El adaptador conoce Supabase.</text>
<text x="1510.0" y="765.2" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">El caso de uso conoce su contrato.</text>
<rect x="80" y="1000" width="1840" height="105" rx="13" fill="white" stroke="#d5dfeb" stroke-width="2"/>
<g transform="translate(102 1021)" fill="none" stroke="#52667d" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="11" width="12" height="17" rx="2"/><rect x="27" y="1" width="12" height="14" rx="2"/><rect x="27" y="25" width="12" height="14" rx="2"/><path d="M13 19h7V8h7M20 19v13h7"/></g>
<text x="163.0" y="1017.0" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#162b47" dominant-baseline="text-before-edge">Composición: conecta las piezas al iniciar.</text>
<text x="163.0" y="1061.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Crea SupabaseReservaAdapter y se lo entrega a CrearReserva como implementación del contrato.</text>
<text x="80.0" y="1144.0" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2468c9" dominant-baseline="text-before-edge">EJECUCIÓN · RECORRIDO DE UNA RESERVA</text>
<text x="80.0" y="1189.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">Aquí las flechas muestran llamadas entre las partes durante una operación.</text>
<rect x="1172" y="1234" width="768" height="181" rx="12" fill="white" stroke="#b4ded0" stroke-width="2" stroke-dasharray="10 7"/>
<text x="1192.0" y="1246.0" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#147d68" dominant-baseline="text-before-edge">BACKEND ADMINISTRADO · SUPABASE</text>
<rect x="80" y="1288" width="300" height="106" rx="11" fill="#eef5ff" stroke="#d5dfeb" stroke-width="2"/>
<g transform="translate(95 1302)" fill="none" stroke="#2468c9" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="1" width="24" height="36" rx="4"/><path d="M14 6h10M16 31h6"/></g>
<text x="150.0" y="1306.0" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#2468c9" dominant-baseline="text-before-edge">Pantalla</text>
<text x="98.0" y="1353.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Recoge la selección</text>
<rect x="450" y="1288" width="300" height="106" rx="11" fill="#f3effb" stroke="#d5dfeb" stroke-width="2"/>
<g transform="translate(465 1302)" fill="none" stroke="#7052b8" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10L20 1l18 9-18 9zM2 20l18 9 18-9M2 29l18 9 18-9"/></g>
<text x="520.0" y="1306.0" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#7052b8" dominant-baseline="text-before-edge">CrearReserva</text>
<text x="468.0" y="1353.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Solicita confirmar</text>
<rect x="820" y="1288" width="300" height="106" rx="11" fill="#fff5e5" stroke="#d5dfeb" stroke-width="2"/>
<g transform="translate(835 1302)" fill="none" stroke="#926018" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 1v11M29 1v11M4 12h32v8q0 11-16 11T4 20zM20 31v8"/></g>
<text x="890.0" y="1306.0" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#926018" dominant-baseline="text-before-edge">Adaptador</text>
<text x="838.0" y="1353.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Traduce y llama</text>
<rect x="1190" y="1288" width="300" height="106" rx="11" fill="#eaf8f2" stroke="#d5dfeb" stroke-width="2"/>
<g transform="translate(1205 1302)" fill="none" stroke="#147d68" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 7L1 20l10 12M29 7l10 13-10 12M24 1l-9 38"/></g>
<text x="1260.0" y="1306.0" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#147d68" dominant-baseline="text-before-edge">API de datos</text>
<text x="1208.0" y="1353.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">REST / RPC</text>
<rect x="1560" y="1288" width="360" height="106" rx="11" fill="#eaf8f2" stroke="#d5dfeb" stroke-width="2"/>
<g transform="translate(1575 1302)" fill="none" stroke="#147d68" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="20" cy="7" rx="18" ry="6"/><path d="M2 7v25c0 8 36 8 36 0V7M2 19c0 8 36 8 36 0"/></g>
<text x="1630.0" y="1306.0" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#147d68" dominant-baseline="text-before-edge">PostgreSQL</text>
<text x="1578.0" y="1353.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">Valida y confirma</text>
<polyline points="380,1340 450,1340" fill="none" stroke="#2468c9" stroke-width="4" stroke-linejoin="round"/>
<polygon points="450.0,1340.0 433.0,1332.0 433.0,1348.0" fill="#2468c9"/>
<polyline points="750,1340 820,1340" fill="none" stroke="#2468c9" stroke-width="4" stroke-linejoin="round"/>
<polygon points="820.0,1340.0 803.0,1332.0 803.0,1348.0" fill="#2468c9"/>
<polyline points="1120,1340 1190,1340" fill="none" stroke="#2468c9" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1190.0,1340.0 1173.0,1332.0 1173.0,1348.0" fill="#2468c9"/>
<polyline points="1490,1340 1560,1340" fill="none" stroke="#2468c9" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1560.0,1340.0 1543.0,1332.0 1543.0,1348.0" fill="#2468c9"/>
<text x="80.0" y="1442.0" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#20364f" dominant-baseline="text-before-edge">PostgreSQL verifica permisos y disponibilidad y guarda las escrituras relacionadas en una transacción.</text>
<text x="80.0" y="1497.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">Clean Architecture separa el código del cliente; la autorización y las reglas transaccionales se conservan en el servidor.</text>
</svg>
