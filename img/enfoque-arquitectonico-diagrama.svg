<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2110" viewBox="0 0 2400 2110"><title>Clean Architecture: dependencias de código en cliente y servidor de App Barbería</title><desc>Vista resumida con presentación e infraestructura dependiendo de aplicación y dominio. El cliente usa un contrato remoto y el servidor un contrato de persistencia atómica. Los servicios externos permanecen fuera del núcleo.</desc><defs><marker id="dep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#505050"/></marker><marker id="impl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9Z" fill="white" stroke="#9d8af4" stroke-width="1.3"/></marker></defs><rect width="2400" height="2110" fill="white"/>
<text x="1200" y="60" font-family="Arial,sans-serif" font-size="43" font-weight="700" text-anchor="middle" fill="#202124">Enfoque arquitectónico · Clean Architecture</text>
<text x="1200" y="109" font-family="Arial,sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#202124">Módulo Reservas · Dependencias del código hacia el núcleo · Aplicado desde el inicio</text>
<text x="100" y="205" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#202124">CLIENTE · Expo / React Native / TypeScript</text>
<rect x="1050" y="240" width="1250" height="600" fill="#ffffe6" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1080" y="282" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#202124">NÚCLEO · APLICACIÓN Y DOMINIO</text>
<rect x="100" y="320" width="580" height="180" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="390" y="362" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#202124">PRESENTACIÓN</text>
<text x="390" y="408" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Pantallas y mensajes</text>
<text x="390" y="443" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Recoge la selección del cliente</text>
<text x="390" y="478" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Invoca SolicitarReserva</text>
<rect x="1120" y="320" width="1110" height="205" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1675" y="362" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#202124">APLICACIÓN</text>
<text x="1675" y="408" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">SolicitarReserva coordina la solicitud al servidor</text>
<text x="1675" y="443" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Contrato: ReservaRemotaGateway</text>
<text x="1675" y="478" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">confirmar(solicitud) → ResultadoReserva</text>
<rect x="100" y="660" width="580" height="180" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="390" y="702" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#202124">INFRAESTRUCTURA</text>
<text x="390" y="748" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">ReservaHttpAdapter</text>
<text x="390" y="783" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Implementa ReservaRemotaGateway</text>
<text x="390" y="818" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Encapsula HTTPS y el SDK Supabase</text>
<rect x="1120" y="660" width="1110" height="150" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1675" y="702" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#202124">DOMINIO</text>
<text x="1675" y="748" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">SolicitudReserva · ResultadoReserva</text>
<text x="1675" y="783" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Tipos propios y validaciones puras de entrada</text>
<path d="M680 405H1120" fill="none" stroke="#505050" stroke-width="2.4"  marker-end="url(#dep)"/>
<rect x="729" y="309" width="161" height="71" fill="#fff" stroke="#fff" stroke-width="1.8"/>
<text x="735" y="335" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">depende del</text>
<text x="735" y="368" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">caso de uso</text>
<path d="M680 710H1010V485H1120" fill="none" stroke="#9d8af4" stroke-width="2.4" stroke-dasharray="9 6" marker-end="url(#impl)"/>
<rect x="704" y="544" width="278" height="71" fill="#fff" stroke="#fff" stroke-width="1.8"/>
<text x="710" y="570" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">depende del contrato</text>
<text x="710" y="603" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">y lo implementa</text>
<path d="M680 795H1120" fill="none" stroke="#505050" stroke-width="2.4"  marker-end="url(#dep)"/>
<rect x="814" y="747" width="239" height="38" fill="#fff" stroke="#fff" stroke-width="1.8"/>
<text x="820" y="773" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">usa tipos propios</text>
<path d="M1675 525V660" fill="none" stroke="#505050" stroke-width="2.4"  marker-end="url(#dep)"/>
<rect x="1689" y="568" width="252" height="38" fill="#fff" stroke="#fff" stroke-width="1.8"/>
<text x="1695" y="594" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">usa tipos y reglas</text>
<rect x="100" y="885" width="2200" height="70" fill="#fafafa" stroke="#d7d7d7" stroke-width="1.8"/>
<text x="125" y="929" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">COMPOSICIÓN: conecta ReservaHttpAdapter con SolicitarReserva a través de ReservaRemotaGateway.</text>
<text x="100" y="1130" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#202124">SERVIDOR · ejecución en Supabase Edge Functions</text>
<rect x="1050" y="1165" width="1250" height="600" fill="#ffffe6" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1080" y="1207" font-family="Arial,sans-serif" font-size="29" font-weight="400" text-anchor="start" fill="#202124">NÚCLEO · APLICACIÓN Y DOMINIO</text>
<rect x="100" y="1245" width="580" height="180" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="390" y="1287" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#202124">PRESENTACIÓN</text>
<text x="390" y="1333" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Entrada HTTP de la Edge Function</text>
<text x="390" y="1368" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Obtiene identidad verificada</text>
<text x="390" y="1403" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Invoca ConfirmarReserva</text>
<rect x="1120" y="1245" width="1110" height="205" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1675" y="1287" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#202124">APLICACIÓN</text>
<text x="1675" y="1333" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">ConfirmarReserva coordina permisos y reglas</text>
<text x="1675" y="1368" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Contrato: ReservaAtomicaGateway</text>
<text x="1675" y="1403" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">confirmar(solicitud, contexto) → ResultadoReserva</text>
<rect x="100" y="1585" width="580" height="180" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="390" y="1627" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#202124">INFRAESTRUCTURA</text>
<text x="390" y="1673" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">PostgresReservaAdapter</text>
<text x="390" y="1708" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Implementa ReservaAtomicaGateway</text>
<text x="390" y="1743" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Encapsula RPC y el SDK Supabase</text>
<rect x="1120" y="1585" width="1110" height="150" fill="#eeebff" stroke="#9d8af4" stroke-width="1.8"/>
<text x="1675" y="1627" font-family="Arial,sans-serif" font-size="31" font-weight="700" text-anchor="middle" fill="#202124">DOMINIO</text>
<text x="1675" y="1673" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">ContextoUsuario · SolicitudReserva · ResultadoReserva</text>
<text x="1675" y="1708" font-family="Arial,sans-serif" font-size="27" font-weight="400" text-anchor="middle" fill="#202124">Tipos propios y reglas puras de reserva</text>
<path d="M680 1330H1120" fill="none" stroke="#505050" stroke-width="2.4"  marker-end="url(#dep)"/>
<rect x="729" y="1234" width="161" height="71" fill="#fff" stroke="#fff" stroke-width="1.8"/>
<text x="735" y="1260" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">depende del</text>
<text x="735" y="1293" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">caso de uso</text>
<path d="M680 1635H1010V1410H1120" fill="none" stroke="#9d8af4" stroke-width="2.4" stroke-dasharray="9 6" marker-end="url(#impl)"/>
<rect x="704" y="1469" width="278" height="71" fill="#fff" stroke="#fff" stroke-width="1.8"/>
<text x="710" y="1495" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">depende del contrato</text>
<text x="710" y="1528" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">y lo implementa</text>
<path d="M680 1720H1120" fill="none" stroke="#505050" stroke-width="2.4"  marker-end="url(#dep)"/>
<rect x="814" y="1672" width="239" height="38" fill="#fff" stroke="#fff" stroke-width="1.8"/>
<text x="820" y="1698" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">usa tipos propios</text>
<path d="M1675 1450V1585" fill="none" stroke="#505050" stroke-width="2.4"  marker-end="url(#dep)"/>
<rect x="1689" y="1493" width="252" height="38" fill="#fff" stroke="#fff" stroke-width="1.8"/>
<text x="1695" y="1519" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">usa tipos y reglas</text>
<rect x="100" y="1810" width="2200" height="70" fill="#fafafa" stroke="#d7d7d7" stroke-width="1.8"/>
<text x="125" y="1854" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">COMPOSICIÓN: conecta PostgresReservaAdapter con ConfirmarReserva a través de ReservaAtomicaGateway.</text>
<rect x="100" y="1008" width="2200" height="1" fill="#dedede" stroke="#dedede" stroke-width="1.8"/>
<text x="100" y="1965" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#202124">REGLA: Aplicación y Dominio no importan Expo, SDK Supabase, Edge Functions ni tipos de tablas.</text>
<text x="100" y="2010" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">Flechas continuas: dependencia de código. Flechas discontinuas: implementación de un contrato interno.</text>
<text x="100" y="2052" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202124">Esta vista no muestra el orden de ejecución. HTTPS, RPC y PostgreSQL son detalles externos al núcleo.</text>
<text x="100" y="2090" font-family="Arial,sans-serif" font-size="25" font-weight="400" text-anchor="start" fill="#202124">PostgreSQL conserva las garantías definitivas de permisos, concurrencia, integridad y transacciones.</text>
</svg>