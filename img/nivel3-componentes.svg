<text x="44.0" y="1234.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#52667d" dominant-baseline="text-before-edge">Lectura central: presentación → coordinación → adaptador → API. El resultado vuelve por las mismas conexiones.</text>
