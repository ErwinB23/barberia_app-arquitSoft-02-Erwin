<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1540" viewBox="0 0 2600 1540"><title>C3 · Componentes que colaboran en una reserva</title><desc>Interior de la aplicación móvil con presentación, coordinación SolicitarReserva, contrato ReservaRemotaGateway, adaptador HTTPS, modelo y composición. El servidor se representa como contenedor fuera del móvil.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2468c9"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7854bb"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#008673"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52667d"/></marker></defs><rect width="2600" height="1540" fill="white"/><rect width="2600" height="150" fill="#162b47"/>
<text x="48" y="64" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="white">C3 · Componentes que colaboran en una reserva</text>
<text x="48" y="118" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#d8e5f5">Abre la Aplicación móvil de C2. Vista parcial: solicitar una reserva con sesión disponible.</text>
<rect x="50" y="220" width="1930" height="1120" rx="14" fill="#fcfdff" stroke="#2468c9" stroke-width="2" stroke-dasharray="11 8"/>
<text x="75" y="267" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#2468c9">APLICACIÓN MÓVIL · Expo / React Native / TypeScript</text>
<rect x="1110" y="320" width="820" height="190" rx="14" fill="#f4f6f8" stroke="#52667d" stroke-width="2" />
<g transform="translate(1135 347)" fill="none" stroke="#52667d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L0 16l10 13M27 3l10 13-10 13M23 0L14 32"/></g>
<text x="1190" y="378" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#52667d">Composición</text>
<text x="1135" y="424" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52667d">Componente · TypeScript</text>
<text x="1135" y="468" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364f">Construye SolicitarReserva y le entrega ReservaHttpAdapter.</text>
<rect x="100" y="640" width="430" height="300" rx="14" fill="#eef5ff" stroke="#2468c9" stroke-width="2" />
<g transform="translate(123 665)" fill="none" stroke="#2468c9" stroke-width="2.5"><rect width="23" height="37" rx="4"/><path d="M6 6h11M8 30h7"/></g>
<text x="165" y="694" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#2468c9">Presentación de reservas</text>
<text x="123" y="745" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52667d">Componente · Expo / React Native</text>
<text x="123" y="792" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364f">Recoge la selección del usuario.</text>
<text x="123" y="829" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364f">Invoca SolicitarReserva.</text>
<text x="123" y="866" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364f">Muestra confirmación, conflicto</text>
<text x="123" y="903" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364f">o error.</text>
<rect x="770" y="640" width="490" height="300" rx="14" fill="#f3effb" stroke="#7854bb" stroke-width="2" />
<g transform="translate(795 667)" fill="none" stroke="#7854bb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L0 16l10 13M27 3l10 13-10 13M23 0L14 32"/></g>
<text x="850" y="696" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#7854bb">Coordinación de reservas</text>
<text x="795" y="745" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52667d">Componente · TypeScript / Aplicación</text>
<text x="795" y="792" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364f">SolicitarReserva valida la entrada</text>
<text x="795" y="829" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364f">y solicita confirmar mediante</text>
<text x="795" y="866" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364f">ReservaRemotaGateway.</text>
<rect x="1510" y="640" width="430" height="300" rx="14" fill="#fff5e7" stroke="#a36612" stroke-width="2" />
<g transform="translate(1535 667)" fill="none" stroke="#a36612" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L0 16l10 13M27 3l10 13-10 13M23 0L14 32"/></g>
<text x="1590" y="696" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#a36612">Adaptador HTTP</text>
<text x="1535" y="745" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52667d">Componente · TypeScript</text>
<text x="1535" y="792" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">ReservaHttpAdapter implementa</text>
<text x="1535" y="829" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">el contrato remoto.</text>
<text x="1535" y="866" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">Traduce la solicitud, la respuesta</text>
<text x="1535" y="903" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">y los errores del servidor.</text>
<rect x="770" y="1160" width="1170" height="150" rx="14" fill="#eaf8f2" stroke="#008673" stroke-width="2" />
<g transform="translate(795 1183)" fill="none" stroke="#008673" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L0 16l10 13M27 3l10 13-10 13M23 0L14 32"/></g>
<text x="850" y="1214" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#008673">Modelo de reserva</text>
<text x="795" y="1256" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52667d">Componente · TypeScript / Dominio</text>
<text x="795" y="1293" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#20364f">SolicitudReserva · ResultadoReserva · tipos propios y validaciones puras.</text>
<path d="M530 790H770" fill="none" stroke="#2468c9" stroke-width="3"  marker-end="url(#blue)"/>
<text x="554" y="710" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#2468c9">Entrega la</text>
<text x="554" y="747" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#2468c9">selección</text>
<path d="M1260 790H1510" fill="none" stroke="#7854bb" stroke-width="3"  marker-end="url(#purple)"/>
<text x="1290" y="710" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#7854bb">Solicita confirmar</text>
<text x="1290" y="747" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#7854bb">por contrato</text>
<path d="M1160 510V567H1015V640" fill="none" stroke="#52667d" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#muted)"/>
<text x="792" y="551" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52667d">Crea el caso de uso</text>
<path d="M1790 510V640" fill="none" stroke="#52667d" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#muted)"/>
<text x="1810" y="554" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52667d">Crea e inyecta</text>
<text x="1810" y="591" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#52667d">el adaptador</text>
<path d="M1015 940V1160" fill="none" stroke="#008673" stroke-width="3"  marker-end="url(#green)"/>
<text x="1045" y="1014" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#008673">Usa tipos y valida</text>
<text x="1045" y="1051" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#008673">la forma de entrada</text>
<path d="M1725 940V1160" fill="none" stroke="#008673" stroke-width="3"  marker-end="url(#green)"/>
<text x="1760" y="1014" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#008673">Usa tipos</text>
<text x="1760" y="1051" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#008673">propios</text>
<text x="2130" y="578" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#008673">CONTENEDOR DE C2</text>
<rect x="2120" y="640" width="430" height="300" rx="14" fill="#eaf8f2" stroke="#008673" stroke-width="2" />
<g transform="translate(2145 665)" fill="none" stroke="#008673" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L0 16l10 13M27 3l10 13-10 13M23 0L14 32"/></g>
<text x="2200" y="694" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#008673">Operaciones de negocio</text>
<text x="2145" y="745" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#52667d">Edge Function / TypeScript</text>
<text x="2145" y="792" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">Verifica la sesión y ejecuta</text>
<text x="2145" y="829" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">el caso de uso del servidor.</text>
<text x="2145" y="866" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">Devuelve confirmación, conflicto</text>
<text x="2145" y="903" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#20364f">o error.</text>
<path d="M1940 790H2120" fill="none" stroke="#2468c9" stroke-width="3"  marker-end="url(#blue)"/>
<text x="1995" y="710" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#2468c9">HTTPS</text>
<text x="1995" y="747" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#2468c9">con sesión</text>
<path d="M50 1360H2550" stroke="#d6e1ee" stroke-width="2"/>
<text x="50" y="1404" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#20364f">Las flechas continuas muestran colaboración durante una reserva; el resultado regresa por las mismas conexiones.</text>
<text x="50" y="1453" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52667d">El contrato pertenece a Aplicación. El caso de uso conoce ese contrato; la composición le entrega el adaptador concreto.</text>
<text x="50" y="1500" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#52667d">Gris discontinuo: construcción e inyección. Verde: uso del modelo. El interior del servidor queda fuera del contenedor móvil.</text>
</svg>